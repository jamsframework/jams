# Builds the jams-bin bundle (including the standard model component
# libraries from the jamsmodels repository) and publishes it as a GitHub
# release. Started manually from the Actions tab ("Run workflow") with the
# version, the release date and the model libraries to bundle. The workflow
# adds the creators and contributors of the bundled model libraries (their .zenodo.json files)
# to the jams .zenodo.json and creates the version
# tag on a commit with that merged file, so Zenodo picks up the author list.
name: Release
run-name: "JAMS ${{ inputs.version || 'release (version from pom.xml)' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 4.1.2 (empty: version from pom.xml)"
        required: false
      date:
        description: "Release date shown in the About dialog, YYYY-MM-DD (empty: today)"
        required: false
      modules:
        description: "Model component libraries to bundle (comma-separated)"
        required: true
        default: J2K_base,J2K_ext,J2K_iso,J2Kg,Thornthwaite

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # full history + tags, needed to list commits since the previous
          # release in the changelog below
          fetch-depth: 0

      - name: Determine release version and date
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then
            prop() { sed -n "s:.*<jams.version.$1>\(.*\)</jams.version.$1>.*:\1:p" pom.xml; }
            VERSION="$(prop major).$(prop minor).$(prop patch)"
          fi
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected X.Y.Z)"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          DATE="${INPUT_DATE:-$(TZ=Europe/Berlin date +%F)}"
          if ! date -d "$DATE" +%F >/dev/null 2>&1 || ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid release date '$DATE' (expected YYYY-MM-DD)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "date=${DATE//-/}" >> "$GITHUB_OUTPUT"
          echo "Releasing JAMS $VERSION, release date $DATE"

      - uses: actions/checkout@v5
        with:
          repository: jamsframework/jamsmodels
          path: jamsmodels
          # full history + tags, needed for the jamsmodels reminder below
          fetch-depth: 0

      # sets MODEL_MODULES (comma-separated, no blanks) for the steps below,
      # after checking the names against the <modules> list of jamsmodels
      - name: Check model library list
        env:
          INPUT_MODULES: ${{ inputs.modules }}
        run: |
          MODULES=$(echo "$INPUT_MODULES" | tr -s ', ' '\n' | sed '/^$/d')
          KNOWN=$(sed -n 's:.*<module>\(.*\)</module>.*:\1:p' jamsmodels/pom.xml)
          UNKNOWN=$(echo "$MODULES" | grep -vxF "$KNOWN" || true)
          if [ -z "$MODULES" ] || [ -n "$UNKNOWN" ]; then
            echo "::error::Unknown or missing model libraries: ${UNKNOWN:-none given} (known: $(echo $KNOWN))"
            exit 1
          fi
          echo "MODEL_MODULES=$(echo $MODULES | tr ' ' ',')" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build application bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ./mvnw --batch-mode --no-transfer-progress install -pl jams-starter -am -Drevision="$VERSION" \
            -Djams.build.date="${{ steps.version.outputs.date }}" \
            -Djams.version.major="${{ steps.version.outputs.major }}" \
            -Djams.version.minor="${{ steps.version.outputs.minor }}" \
            -Djams.version.patch="${{ steps.version.outputs.patch }}"

      - name: Register jams-api/jams-main for jamsmodels
        run: |
          cp jams-api/target/jams-api-*.jar jamsmodels/jams-libs/
          cp jams-main/target/jams-main-*.jar jamsmodels/jams-libs/
          (cd jamsmodels && ./install-jams-libs.sh)

      - name: Build model components
        working-directory: jamsmodels
        run: ./mvnw --batch-mode --no-transfer-progress package -pl "$MODEL_MODULES" -am

      - name: Add model components to bundle
        run: |
          cp jamsmodels/components/*.jar jams-bin/components/
          if [ -d jamsmodels/components/lib ]; then
            mkdir -p jams-bin/components/lib
            cp jamsmodels/components/lib/*.jar jams-bin/components/lib/
          fi
          ls jams-bin/components/

      # Zenodo reads .zenodo.json from the tagged commit. The people of the
      # bundled model libraries are added to it, and the release date to
      # pom.xml, on a release commit that is only reachable through the tag,
      # so the maintained files on the branch stay unchanged.
      - name: Add model library people to Zenodo metadata and create tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 jamsmodels/tools/zenodo_authors.py build --root jamsmodels \
            --modules "$MODEL_MODULES" --zenodo .zenodo.json
          sed -i "s:<jams.build.date>.*</jams.build.date>:<jams.build.date>${{ steps.version.outputs.date }}</jams.build.date>:" pom.xml
          sed -i "s:<jams.version.major>.*</jams.version.major>:<jams.version.major>${{ steps.version.outputs.major }}</jams.version.major>:" pom.xml
          sed -i "s:<jams.version.minor>.*</jams.version.minor>:<jams.version.minor>${{ steps.version.outputs.minor }}</jams.version.minor>:" pom.xml
          sed -i "s:<jams.version.patch>.*</jams.version.patch>:<jams.version.patch>${{ steps.version.outputs.patch }}</jams.version.patch>:" pom.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- .zenodo.json pom.xml; then
            git commit -m "Release $VERSION" -- .zenodo.json pom.xml
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Package bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv jams-bin "jams-$VERSION"
          zip -r -q "jams-$VERSION.zip" "jams-$VERSION"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || true)
          {
            echo "JAMS $VERSION — ready-to-run application bundle."
            echo
            echo "Download and unpack \`jams-$VERSION.zip\`, then start the JAMS launcher with \`jams.sh\`/\`jams.bat\` or the JAMS model editor with \`juice.sh\`/\`juice.bat\`. Requires a Java runtime (JRE) 17 or newer."
            echo
            echo "Included model component libraries: ${MODEL_MODULES//,/, } (from the [jamsmodels](https://github.com/jamsframework/jamsmodels) repository)."
            echo
            # only list commits that actually touch application source, so
            # housekeeping (mailmap, docs, CI/release-workflow tweaks,
            # version-bump commits) doesn't clutter the release notes
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since $PREV_TAG"
              echo
              git log --pretty=format:"- %s (%h)" --no-merges "$PREV_TAG..HEAD" -- ':(glob)*/src/main/**'
            else
              echo "## Changes"
              echo
              git log --pretty=format:"- %s (%h)" --no-merges HEAD -- ':(glob)*/src/main/**'
            fi
            echo
          } > release-notes.md
          URL=$(gh release create "v$VERSION" "jams-$VERSION.zip" --verify-tag \
            --title "JAMS $VERSION" \
            --notes-file release-notes.md)
          DATE="${{ steps.version.outputs.date }}"
          COUNT() { python3 -c "import json,sys; print(len(json.load(open('.zenodo.json')).get(sys.argv[1], [])))" "$1"; }
          {
            echo "## JAMS $VERSION"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | $VERSION |"
            echo "| Release date | ${DATE:6:2}.${DATE:4:2}.${DATE:0:4} |"
            echo "| Model libraries | ${MODEL_MODULES//,/, } |"
            echo "| Zenodo creators / contributors | $(COUNT creators) / $(COUNT contributors) |"
            echo "| Release | $URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      # jamsmodels is released by its own workflow; remind of it when its
      # libraries changed since its last release (commits that only touch
      # the author lists do not count)
      - name: Check for unreleased jamsmodels changes
        working-directory: jamsmodels
        run: |
          LIBS=$(sed -n 's:.*<module>\(.*\)</module>.*:\1:p' pom.xml)
          LAST=$(git tag -l 'v*' --sort=-creatordate | grep -v / | head -1)
          if [ -n "$LAST" ]; then
            NEW=$(git rev-list --count --no-merges "$LAST..HEAD" -- $LIBS ':(exclude,glob)*/.zenodo.json')
          else
            NEW=all
          fi
          if [ "$NEW" != 0 ]; then
            MSG="jamsmodels has $NEW unreleased commits in its libraries since ${LAST:-the start}. Please start its Release workflow: https://github.com/jamsframework/jamsmodels/actions/workflows/release.yml"
            echo "::warning::$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi
